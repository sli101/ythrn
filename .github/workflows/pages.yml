name: نشر الويب على GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.9
          channel: stable
          cache: true
      # ملفا sql.js اللذان يحتاجهما تخزين drift على الويب (غير محفوظين في المستودع لأنهما ثنائيان).
      - name: جلب sql.js
        run: |
          curl -fsSL -o web/sql-wasm.js   https://cdn.jsdelivr.net/npm/sql.js@1.13.0/dist/sql-wasm.js
          curl -fsSL -o web/sql-wasm.wasm https://cdn.jsdelivr.net/npm/sql.js@1.13.0/dist/sql-wasm.wasm
      - run: flutter pub get
      - run: flutter analyze --no-pub
      - run: flutter test
      - run: flutter build web --release --base-href /${{ github.event.repository.name }}/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
